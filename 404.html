<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKS.Tech - Page Not Found</title>
    <meta name="theme-color" content="#d4af37">
    <link rel="icon" href="assets/images/icon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #121929 0%, #080b11 100%);
            font-family: 'Cairo', system-ui, sans-serif;
            color: #f8fafc;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(15, 21, 35, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            padding: 45px 35px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 45px rgba(0,0,0,0.6), 0 0 25px rgba(212,175,55,0.1);
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .icon { font-size: 56px; margin-bottom: 12px; }
        h1 { font-size: 26px; color: #d4af37; margin-bottom: 8px; font-weight: 700; }
        .code { font-family: 'Cinzel', serif; font-size: 76px; font-weight: 900; color: rgba(212, 175, 55, 0.25); line-height: 1; margin-bottom: 6px; letter-spacing: 2px; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.7; margin-bottom: 20px; }
        .countdown { color: #d4af37; font-weight: bold; font-size: 16px; margin-bottom: 24px; }
        .buttons { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 24px; border-radius: 25px; font-size: 15px; font-weight: 600;
            text-decoration: none; cursor: pointer; border: none;
            transition: all 0.25s ease; width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            font-weight: 700;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(212,175,55,0.35); }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: #f8fafc;
            border: 1px solid rgba(212,175,55,0.3);
        }
        .btn-secondary:hover { background: rgba(212,175,55,0.15); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="code">404</div>
        <div class="icon">✨</div>
        <h1>الصفحة غير موجودة</h1>
        <p>الصفحة التي تبحث عنها غير متوفرة أو تم نقلها.<br>سيتم تحويلك تلقائياً إلى الصفحة الرئيسية.</p>
        <div class="countdown">⏳ إعادة التوجيه خلال <span id="timer">5</span> ثوانٍ...</div>
        <div class="buttons">
            <a href="index.html" class="btn btn-primary">🏠 الذهاب للموقع الرئيسي</a>
            <button onclick="location.reload()" class="btn btn-secondary">🔄 إعادة تحميل الصفحة</button>
        </div>
    </div>
    <script>
        let seconds = 5;
        const timerEl = document.getElementById('timer');
        const interval = setInterval(() => {
            seconds--;
            timerEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.replace("index.html");
            }
        }, 1000);
    </script>
</body>
</html>
